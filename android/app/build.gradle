plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orderflow.mobile'
    compileSdk 35
    // The runner image's default NDK (ubuntu-24.04): AGP strips the .so with it
    // instead of looking for its own default version.
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.orderflow.mobile'
        // Android 11: no older phone is a target (plan §8).
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            // The S25 Ultra and every current phone; libof_mobile.so is built for it only.
            abiFilters 'arm64-v8a'
        }
    }

    // One debug key for every CI build, so a new APK installs over the old one:
    // with a fresh key per build Android refuses the update, and uninstalling
    // first wipes the app's data. A debug key only (password "android", like the
    // SDK's own); a release key will live in the repository's secrets.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // appcompat brings kotlin-stdlib 1.8.22, games-activity's tree the old
    // kotlin-stdlib-jdk7/jdk8 1.6.21 with the same classes (checkDebugDuplicateClasses
    // fails): the BOM lifts those to 1.8.22, where they are empty shims.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // The Java side of android-activity's GameActivity glue: its README pins
    // 4.4.0 for android-activity 0.6.1, without prefab (the C++ glue is in Rust).
    implementation 'androidx.games:games-activity:4.4.0'
}
